[package]
name = "fre"
version = "0.1.0"
edition = "2024"

[dependencies]
bincode = { version = "1.3.3" }
clap = {version = "4.5.37", features = ["derive", "cargo"]}
line-span = "0.1.5"
lualexer = "0.1.2"
mlua = {version = "0.11.4", features = ["lua54", "vendored", "serde"]}
ordermap = { version = "1.1.0", features = ["serde"] }
pak-db = { workspace = true }
postcard = { version = "1.1.3", features = ["alloc"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = "2.0.12"
uuid = {version = "1.18.1", features = ["v4", "serde"]}
