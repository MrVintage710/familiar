[workspace]
members = ["familiar-backend", "familiar-rules-engine"]
resolver = "3"

[workspace.dependencies]
fre = { path = "./familiar-rules-engine"}
pak-db = { path = "../pak" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1"
mlua = {version = "0.11.4", features = ["lua54", "vendored", "serde"]}